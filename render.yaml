services:
  - type: web
    name: skin-diagnosis
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn skin_diagnosis_backend.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skin-diagnosis-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11

databases:
  - name: skin-diagnosis-db
    plan: free