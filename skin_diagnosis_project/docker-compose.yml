version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: changeme
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh /app/entrypoint.sh
    volumes:
      - .:/app:cached
    environment:
      - DEBUG=0
      - SECRET_KEY=changeme
      - DATABASE_URL=postgres://app_user:changeme@db:5432/app_db
      - ALLOWED_HOSTS=localhost,127.0.0.1
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
volumes:
  db_data:
